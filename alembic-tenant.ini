# Migraciones de la base de datos tenant. Uso:
#   uv run alembic -c alembic-tenant.ini -x database=tenant_<id> upgrade head
# Usa las credenciales de provisión (PROVISIONER_DB_*). Para migrar TODOS los tenants
# usa `uv run python scripts/migrate_tenants.py`.

[alembic]
script_location = %(here)s/migrations/tenant
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
