# Migraciones de la base de datos central. Uso:
#   uv run alembic -c alembic-central.ini upgrade head
# Usa las credenciales de administrador (ADMIN_DB_*) y CONTROL_DB_NAME del entorno.
# Normalmente es mejor `uv run python scripts/bootstrap_database.py`, que además crea
# roles y permisos.

[alembic]
script_location = %(here)s/migrations/central
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
